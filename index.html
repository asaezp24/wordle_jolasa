<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WORDLE</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/code.js" defer></script>
    <link rel="icon" type="image/x-icon" href="img/bloque-abc.ico">
</head>

<body>
    <h1 class="izenburua">WORDLE JOLASA</h1>

    <div class="form" id="sarrera">
        <p>Saiakerak</p>
        <div>
            <select id="saiakera" name="saiakera" class="select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>

        <p>Letra kopurua</p>
        <div>
            <select id="letra" name="letra" class="select">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>
        </div>

        <div>
            <button type="button" class="botoia" id="jolastuBotoia">
                Jolastu
            </button>
        </div>
    </div>

    <div id="blokeak" class="blokeakContainer"></div>

    <div class="tek" id="jolasa">
        <div class="tek2">
            <button class="letrak tildeak">Á</button>
            <button class="letrak tildeak">É</button>
            <button class="letrak tildeak">Í</button>
            <button class="letrak tildeak">Ó</button>
            <button class="letrak tildeak">Ú</button>
        </div>

        <div class="tek2">
            <button class="letrak">Q</button>
            <button class="letrak">W</button>
            <button class="letrak">E</button>
            <button class="letrak">R</button>
            <button class="letrak">T</button>
            <button class="letrak">Y</button>
            <button class="letrak">U</button>
            <button class="letrak">I</button>
            <button class="letrak">O</button>
            <button class="letrak">P</button>
        </div>

        <div class="tek2">
            <button class="letrak">A</button>
            <button class="letrak">S</button>
            <button class="letrak">D</button>
            <button class="letrak">F</button>
            <button class="letrak">G</button>
            <button class="letrak">H</button>
            <button class="letrak">J</button>
            <button class="letrak">K</button>
            <button class="letrak">L</button>
            <button class="letrak">Ñ</button>
        </div>

        <div class="tek2">
            <button class="letrak" id="enterBotoia">ENTER</button>
            <button class="letrak">Z</button>
            <button class="letrak">X</button>
            <button class="letrak">C</button>
            <button class="letrak">V</button>
            <button class="letrak">B</button>
            <button class="letrak">N</button>
            <button class="letrak">M</button>
            <button class="letrak" id="ezabatuBotoia">DEL</button>
        </div>
    </div>

    <div id="historiala" class="historiala"></div>
</body>

</html>
