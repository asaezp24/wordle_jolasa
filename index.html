<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WORDLE</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/code.js" defer></script>
    <link rel="icon" type="image/x-icon" href="img/bloque-abc.ico">
</head>

<body>
    <h1 class="izenburua">WORDLE JOLASA</h1>

    <div class="form" id="sarrera">
        <p>Saiakerak</p>
        <div>
            <select id="saiakera" name="saiakera" class="select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>
        <p>Letra kopurua</p>
        <div>
            <select id="letra" name="letra" class="select">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>
        </div>
        <div>
            <button type="button" class="botoia" onclick="jokoaHasi()">
                Jolastu
            </button>
        </div>
    </div>

    <div id="blokeak" class="blokeakContainer"></div>

    <div class="tek" id="jolasa">
        <div class="tek2">
            <span class="letrak tildeak" onclick="letraHartu(this)">Á</span>
            <span class="letrak tildeak" onclick="letraHartu(this)">É</span>
            <span class="letrak tildeak" onclick="letraHartu(this)">Í</span>
            <span class="letrak tildeak" onclick="letraHartu(this)">Ó</span>
            <span class="letrak tildeak" onclick="letraHartu(this)">Ú</span>
        </div>
        <div class="tek2">
            <span class="letrak" onclick="letraHartu(this)">Q</span>
            <span class="letrak" onclick="letraHartu(this)">W</span>
            <span class="letrak" onclick="letraHartu(this)">E</span>
            <span class="letrak" onclick="letraHartu(this)">R</span>
            <span class="letrak" onclick="letraHartu(this)">T</span>
            <span class="letrak" onclick="letraHartu(this)">Y</span>
            <span class="letrak" onclick="letraHartu(this)">U</span>
            <span class="letrak" onclick="letraHartu(this)">I</span>
            <span class="letrak" onclick="letraHartu(this)">O</span>
            <span class="letrak" onclick="letraHartu(this)">P</span>
        </div>
        <div class="tek2">
            <span class="letrak" onclick="letraHartu(this)">A</span>
            <span class="letrak" onclick="letraHartu(this)">S</span>
            <span class="letrak" onclick="letraHartu(this)">D</span>
            <span class="letrak" onclick="letraHartu(this)">F</span>
            <span class="letrak" onclick="letraHartu(this)">G</span>
            <span class="letrak" onclick="letraHartu(this)">H</span>
            <span class="letrak" onclick="letraHartu(this)">J</span>
            <span class="letrak" onclick="letraHartu(this)">K</span>
            <span class="letrak" onclick="letraHartu(this)">L</span>
            <span class="letrak" onclick="letraHartu(this)">Ñ</span>
        </div>
        <div class="tek2">
            <span class="letrak" onclick="enter()">ENTER</span>
            <span class="letrak" onclick="letraHartu(this)">Z</span>
            <span class="letrak" onclick="letraHartu(this)">X</span>
            <span class="letrak" onclick="letraHartu(this)">C</span>
            <span class="letrak" onclick="letraHartu(this)">V</span>
            <span class="letrak" onclick="letraHartu(this)">B</span>
            <span class="letrak" onclick="letraHartu(this)">N</span>
            <span class="letrak" onclick="letraHartu(this)">M</span>
            <span class="letrak" onclick="ezabatu()">DEL</span>
        </div>
    </div>

</body>

</html>
